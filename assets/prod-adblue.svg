<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="AdBlue（尿素水）正規品販売のイメージ">
  <defs>
    <pattern id="ab-st" width="28" height="28" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="none"/>
      <rect width="14" height="28" fill="#ffffff" opacity="0.035"/>
    </pattern>
  </defs>

  <!-- ground -->
  <rect width="640" height="400" fill="#101618"/>
  <rect width="640" height="400" fill="url(#ab-st)"/>
  <circle cx="392" cy="196" r="158" fill="#40b8d0" opacity="0.18"/>
  <circle cx="392" cy="196" r="158" fill="none" stroke="#40b8d0" stroke-width="4" opacity="0.5"/>
  <rect x="0" y="336" width="640" height="8" fill="#40b8d0" opacity="0.55"/>

  <!-- back canister -->
  <g stroke="#000" stroke-width="6" stroke-linejoin="round">
    <rect x="452" y="176" width="122" height="160" rx="12" fill="#cfdadd"/>
    <rect x="486" y="152" width="54" height="26" rx="6" fill="#40b8d0"/>
    <path d="M470 216h86M470 250h86" stroke="#000" stroke-width="5" opacity="0.35"/>
  </g>

  <!-- main jug -->
  <g stroke="#000" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M182 336V152c0-15 11-26 26-26h38l6-24h76l6 24h38c15 0 26 11 26 26v184z" fill="#f4f7f8"/>
    <rect x="296" y="66" width="64" height="36" rx="7" fill="#40b8d0"/>
    <path d="M309 74v20M324 74v20M339 74v20" stroke="#0d3f4c" stroke-width="5"/>
    <!-- handle -->
    <path d="M206 142h62c12 0 21 9 21 21v6c0 12-9 21-21 21h-62z" fill="#e4ecee"/>
    <rect x="224" y="160" width="46" height="14" rx="7" fill="#101618" stroke="none"/>
    <!-- label -->
    <rect x="206" y="212" width="190" height="98" rx="6" fill="#ffffff"/>
    <rect x="206" y="212" width="190" height="30" rx="0" fill="#40b8d0"/>
  </g>
  <text x="301" y="235" text-anchor="middle" font-family="'Arial Black',Impact,sans-serif" font-size="17" fill="#0b2b34" letter-spacing="1.5">AdBlue®</text>
  <text x="301" y="276" text-anchor="middle" font-family="'Arial Black',Impact,sans-serif" font-size="30" fill="#101618">正規品</text>
  <text x="301" y="300" text-anchor="middle" font-family="'Arial Black',Impact,sans-serif" font-size="13" fill="#48606a" letter-spacing="2">10L / 20L / BULK</text>

  <!-- droplets -->
  <g stroke="#000" stroke-width="5">
    <path d="M470 96c0 0-26 26-26 41a26 26 0 0 0 52 0c0-15-26-41-26-41z" fill="#40b8d0"/>
    <path d="M540 60c0 0-15 15-15 24a15 15 0 0 0 30 0c0-9-15-24-15-24z" fill="#6fd0e2"/>
  </g>

</svg>
