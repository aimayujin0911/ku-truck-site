<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="輸入トラックタイヤ販売のイメージ">
  <defs>
    <pattern id="ty-st" width="28" height="28" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="none"/>
      <rect width="14" height="28" fill="#ffffff" opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="#101618"/>
  <rect width="640" height="400" fill="url(#ty-st)"/>
  <circle cx="416" cy="196" r="150" fill="#40b8d0" opacity="0.18"/>
  <rect x="0" y="336" width="640" height="8" fill="#40b8d0" opacity="0.55"/>

  <!-- stacked tyres (left) -->
  <g stroke="#000" stroke-width="6">
    <ellipse cx="150" cy="306" rx="104" ry="36" fill="#22292c"/>
    <ellipse cx="150" cy="296" rx="104" ry="36" fill="#2c3438"/>
    <ellipse cx="150" cy="296" rx="46" ry="15" fill="#101618"/>
    <ellipse cx="150" cy="252" rx="104" ry="36" fill="#2c3438"/>
    <ellipse cx="150" cy="252" rx="46" ry="15" fill="#101618"/>
    <ellipse cx="150" cy="208" rx="104" ry="36" fill="#39434a"/>
    <ellipse cx="150" cy="208" rx="46" ry="15" fill="#101618"/>
  </g>

  <!-- standing tyre (right) -->
  <g>
    <circle cx="416" cy="200" r="140" fill="#2c3438" stroke="#000" stroke-width="7"/>
    <!-- tread blocks -->
    <circle cx="416" cy="200" r="124" fill="none" stroke="#101618" stroke-width="26" stroke-dasharray="20 16"/>
    <circle cx="416" cy="200" r="106" fill="none" stroke="#000" stroke-width="5" opacity="0.6"/>
    <!-- rim -->
    <circle cx="416" cy="200" r="74" fill="#e7edee" stroke="#000" stroke-width="7"/>
    <circle cx="416" cy="200" r="24" fill="#40b8d0" stroke="#000" stroke-width="6"/>
    <g fill="#101618">
      <circle cx="416" cy="152" r="9"/>
      <circle cx="461" cy="185" r="9"/>
      <circle cx="444" cy="238" r="9"/>
      <circle cx="388" cy="238" r="9"/>
      <circle cx="371" cy="185" r="9"/>
    </g>
  </g>

  <!-- size tag -->
  <g>
    <rect x="428" y="60" width="164" height="46" fill="#ffffff" stroke="#000" stroke-width="6"/>
    <text x="510" y="90" text-anchor="middle" font-family="'Arial Black',Impact,sans-serif" font-size="19" fill="#101618" letter-spacing="1">295/80R22.5</text>
  </g>

</svg>
