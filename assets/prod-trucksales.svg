<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="トラック買取・販売のイメージ">
  <defs>
    <pattern id="ts-st" width="28" height="28" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="none"/>
      <rect width="14" height="28" fill="#ffffff" opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="#101618"/>
  <rect width="640" height="400" fill="url(#ts-st)"/>
  <circle cx="330" cy="188" r="160" fill="#40b8d0" opacity="0.16"/>
  <rect x="0" y="336" width="640" height="8" fill="#40b8d0" opacity="0.55"/>

  <!-- truck (side view) -->
  <g stroke="#000" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- box body -->
    <rect x="238" y="128" width="270" height="132" rx="6" fill="#f4f7f8"/>
    <path d="M238 168h270" stroke="#000" stroke-width="5" opacity="0.35"/>
    <!-- cab -->
    <path d="M238 128h-56c-10 0-18 6-21 15l-17 47c-2 5-3 9-3 14v56h97z" fill="#dfe8ea"/>
    <path d="M186 148h44v42h-58z" fill="#40b8d0"/>
    <!-- chassis -->
    <rect x="141" y="260" width="367" height="18" fill="#22292c"/>
    <!-- wheels -->
    <circle cx="196" cy="288" r="34" fill="#22292c"/>
    <circle cx="196" cy="288" r="13" fill="#e7edee"/>
    <circle cx="418" cy="288" r="34" fill="#22292c"/>
    <circle cx="418" cy="288" r="13" fill="#e7edee"/>
  </g>

  <!-- swap arrows (buy & sell) -->
  <g stroke="#40b8d0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M300 86h96"/>
    <path d="M376 68l22 18-22 18"/>
    <path d="M396 50h-96"/>
    <path d="M320 32l-22 18 22 18"/>
  </g>

  <!-- price tag -->
  <g transform="rotate(-8 528 246)">
    <path d="M462 186h146c9 0 16 7 16 16v96c0 9-7 16-16 16H462l-32-64z" fill="#ffffff" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="462" cy="250" r="11" fill="#101618"/>
    <text x="546" y="246" text-anchor="middle" font-family="'Arial Black',Impact,sans-serif" font-size="44" fill="#101618">¥</text>
    <text x="546" y="284" text-anchor="middle" font-family="'Arial Black',Impact,sans-serif" font-size="20" fill="#0b2b34">査定</text>
  </g>

</svg>
