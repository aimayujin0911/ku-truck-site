<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="AdBlue® 正規品販売 — 給油ノズルとIBCタンク">
  <defs>
    <pattern id="stripes" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="48" fill="#000000" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1600" height="1000" fill="#181d22"/>
  <rect width="1600" height="1000" fill="url(#stripes)"/>

  <!-- 中央の円盤（タンク背後・控えめ） -->
  <circle cx="1020" cy="480" r="380" fill="#142a31"/>
  <circle cx="1020" cy="480" r="382" fill="none" stroke="#24515c" stroke-width="5"/>

  <!-- 床ライン -->
  <line x1="0" y1="840" x2="1600" y2="840" stroke="#40b8d0" stroke-opacity="0.75" stroke-width="4"/>

  <!-- IBCタンク -->
  <g>
    <!-- パレット -->
    <rect x="690" y="775" width="660" height="70" rx="6" fill="#3b4248" stroke="#0b0e10" stroke-width="6"/>
    <rect x="696" y="780" width="648" height="12" fill="#6c757c"/>
    <rect x="705" y="845" width="120" height="45" rx="4" fill="#3b4248" stroke="#0b0e10" stroke-width="6"/>
    <rect x="960" y="845" width="120" height="45" rx="4" fill="#3b4248" stroke="#0b0e10" stroke-width="6"/>
    <rect x="1225" y="845" width="120" height="45" rx="4" fill="#3b4248" stroke="#0b0e10" stroke-width="6"/>
    <!-- キャップ（3分割・テール） -->
    <rect x="935" y="285" width="155" height="82" rx="10" fill="#40b8d0" stroke="#0b0e10" stroke-width="6"/>
    <line x1="987" y1="291" x2="987" y2="361" stroke="#0b0e10" stroke-width="6"/>
    <line x1="1038" y1="291" x2="1038" y2="361" stroke="#0b0e10" stroke-width="6"/>
    <!-- ケージ本体 -->
    <rect x="725" y="365" width="585" height="405" rx="10" fill="#b8bfc2"/>
    <!-- 液面（下段テール） -->
    <rect x="729" y="625" width="577" height="141" fill="#40b8d0"/>
    <!-- 格子 -->
    <g stroke="#353c41" stroke-width="5">
      <line x1="835" y1="365" x2="835" y2="770"/>
      <line x1="950" y1="365" x2="950" y2="770"/>
      <line x1="1075" y1="365" x2="1075" y2="770"/>
      <line x1="1200" y1="365" x2="1200" y2="770"/>
      <line x1="725" y1="470" x2="1310" y2="470"/>
      <line x1="725" y1="565" x2="1310" y2="565"/>
      <line x1="725" y1="625" x2="1310" y2="625"/>
    </g>
    <rect x="725" y="365" width="585" height="405" rx="10" fill="none" stroke="#0b0e10" stroke-width="8"/>
    <!-- ラベル -->
    <rect x="825" y="405" width="390" height="140" rx="10" fill="#2a2f33" stroke="#0b0e10" stroke-width="6"/>
    <rect x="845" y="420" width="350" height="80" rx="6" fill="#0a0c0e"/>
    <text x="862" y="480" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="48" letter-spacing="2" fill="#40b8d0">AdBlue<tspan font-size="20" dy="-22">®</tspan></text>
    <text x="852" y="532" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="29" letter-spacing="3" fill="#dfe7ea">AUS 32 / IBC 1000L</text>
    <!-- 排出バルブ（右下） -->
    <path d="M1215 645 L1275 588" stroke="#0b0e10" stroke-width="30" stroke-linecap="round"/>
    <path d="M1215 645 L1275 588" stroke="#40b8d0" stroke-width="13" stroke-linecap="round"/>
    <rect x="1090" y="640" width="140" height="65" rx="8" fill="#3b4248" stroke="#0b0e10" stroke-width="6"/>
    <rect x="1135" y="705" width="52" height="60" rx="6" fill="#b8bfc2" stroke="#0b0e10" stroke-width="6"/>
  </g>

  <!-- ホース（グリップ下→床沿いに左へ） -->
  <path d="M382 709 C380 760 340 778 290 778 L0 778" fill="none" stroke="#0b0e10" stroke-width="52" stroke-linecap="round"/>
  <path d="M382 709 C380 760 340 778 290 778 L0 778" fill="none" stroke="#3b4248" stroke-width="40" stroke-linecap="round"/>

  <!-- 給油ノズル（本体中心(360,490)・18°上向き） -->
  <g transform="translate(360 490) rotate(-18)">
    <!-- グリップ -->
    <rect x="-95" y="40" width="95" height="175" rx="22" fill="#3b4248" stroke="#0b0e10" stroke-width="6"/>
    <!-- トリガーガード（テール） -->
    <path d="M10 50 C10 130 110 130 110 50" fill="none" stroke="#0b0e10" stroke-width="26" stroke-linecap="round"/>
    <path d="M10 50 C10 130 110 130 110 50" fill="none" stroke="#40b8d0" stroke-width="14" stroke-linecap="round"/>
    <!-- ホース継手（テール） -->
    <rect x="-150" y="-36" width="40" height="72" rx="8" fill="#40b8d0" stroke="#0b0e10" stroke-width="6"/>
    <!-- 本体（灰） -->
    <rect x="-115" y="-50" width="230" height="100" rx="20" fill="#b8bfc2" stroke="#0b0e10" stroke-width="6"/>
    <rect x="-90" y="-34" width="130" height="12" rx="6" fill="#ffffff" fill-opacity="0.55"/>
    <!-- カラー -->
    <rect x="112" y="-46" width="34" height="92" rx="6" fill="#0b0e10"/>
    <!-- 吐出管（テール）＋先端 -->
    <rect x="140" y="-27" width="150" height="54" rx="14" fill="#40b8d0" stroke="#0b0e10" stroke-width="6"/>
    <rect x="272" y="-24" width="24" height="48" rx="8" fill="#dfe7ea" stroke="#0b0e10" stroke-width="4"/>
  </g>

  <!-- 左上タブ -->
  <rect x="50" y="90" width="470" height="105" rx="6" fill="#0a0c0e"/>
  <text x="110" y="166" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="60" letter-spacing="3" fill="#40b8d0">AdBlue<tspan font-size="26" dy="-26">®</tspan></text>
</svg>
