<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="AdBlue® 正規品販売 — 給油ノズルとIBCタンク">
  <defs>
    <pattern id="stripes" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="56" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- 背景（濃紺黒＋斜めストライプ） -->
  <rect width="1600" height="1000" fill="#0d141a"/>
  <rect width="1600" height="1000" fill="url(#stripes)"/>

  <!-- 中央の円盤（濃いティール）＋リング -->
  <circle cx="1000" cy="520" r="470" fill="none" stroke="#40b8d0" stroke-opacity="0.22" stroke-width="4"/>
  <circle cx="1000" cy="520" r="400" fill="#113742"/>
  <circle cx="1000" cy="520" r="416" fill="none" stroke="#40b8d0" stroke-opacity="0.85" stroke-width="6"/>

  <!-- IBCタンク（右） -->
  <g>
    <!-- パレット -->
    <rect x="920" y="800" width="460" height="46" rx="6" fill="#1a2226" stroke="#000" stroke-width="5"/>
    <rect x="944" y="846" width="58" height="32" fill="#1a2226" stroke="#000" stroke-width="5"/>
    <rect x="1121" y="846" width="58" height="32" fill="#1a2226" stroke="#000" stroke-width="5"/>
    <rect x="1298" y="846" width="58" height="32" fill="#1a2226" stroke="#000" stroke-width="5"/>
    <!-- 上部リムと注入口キャップ -->
    <rect x="1110" y="236" width="80" height="40" rx="8" fill="#40b8d0" stroke="#000" stroke-width="5"/>
    <rect x="960" y="270" width="380" height="34" rx="6" fill="#dfe7ea" stroke="#000" stroke-width="5"/>
    <!-- 本体（ケージ） -->
    <rect x="940" y="290" width="420" height="510" rx="16" fill="#eef3f5" stroke="#000" stroke-width="6"/>
    <g stroke="#000" stroke-opacity="0.28" stroke-width="4">
      <line x1="1045" y1="290" x2="1045" y2="800"/>
      <line x1="1150" y1="290" x2="1150" y2="800"/>
      <line x1="1255" y1="290" x2="1255" y2="800"/>
      <line x1="940" y1="392" x2="1360" y2="392"/>
      <line x1="940" y1="494" x2="1360" y2="494"/>
      <line x1="940" y1="596" x2="1360" y2="596"/>
      <line x1="940" y1="698" x2="1360" y2="698"/>
    </g>
    <!-- ラベル -->
    <rect x="990" y="485" width="320" height="155" rx="10" fill="#0d141a" stroke="#000" stroke-width="5"/>
    <text x="1015" y="548" font-family="Anton,'Arial Black',Impact,sans-serif" font-weight="900" font-size="54" fill="#ffffff">AdBlue<tspan font-size="22" dy="-24">®</tspan></text>
    <text x="1015" y="606" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-weight="700" font-size="26" letter-spacing="2" fill="#dff4f8">AUS 32 / IBC 1000L</text>
    <!-- 排出バルブ（左下・左向き） -->
    <rect x="898" y="692" width="22" height="30" rx="4" fill="#000"/>
    <rect x="880" y="718" width="66" height="44" rx="8" fill="#40b8d0" stroke="#000" stroke-width="5"/>
    <rect x="852" y="729" width="34" height="22" rx="4" fill="#0d141a" stroke="#000" stroke-width="4"/>
  </g>

  <!-- 給油ノズル（左・右向き） -->
  <g>
    <!-- ホース（グリップ下から左下へ） -->
    <path d="M370 800 C370 900 300 950 120 985" fill="none" stroke="#000" stroke-width="42" stroke-linecap="round"/>
    <path d="M370 800 C370 900 300 950 120 985" fill="none" stroke="#40b8d0" stroke-width="30" stroke-linecap="round"/>
    <!-- グリップ -->
    <rect x="300" y="520" width="140" height="290" rx="30" fill="#40b8d0" stroke="#000" stroke-width="6"/>
    <!-- トリガー -->
    <path d="M470 545 q40 66 100 34" fill="none" stroke="#000" stroke-width="28" stroke-linecap="round"/>
    <path d="M470 545 q40 66 100 34" fill="none" stroke="#40b8d0" stroke-width="15" stroke-linecap="round"/>
    <!-- 本体 -->
    <rect x="260" y="380" width="500" height="160" rx="30" fill="#40b8d0" stroke="#000" stroke-width="6"/>
    <rect x="292" y="406" width="170" height="18" rx="9" fill="#ffffff" fill-opacity="0.45"/>
    <!-- 吐出管（真横・タンクへ） -->
    <path d="M750 460 L905 460" fill="none" stroke="#000" stroke-width="66" stroke-linecap="round"/>
    <path d="M750 460 L905 460" fill="none" stroke="#40b8d0" stroke-width="50" stroke-linecap="round"/>
    <rect x="884" y="432" width="52" height="56" rx="8" fill="#0d141a" stroke="#000" stroke-width="5"/>
  </g>

  <!-- 左上タブ -->
  <rect x="80" y="60" width="380" height="110" rx="10" fill="#1a2226" stroke="#000" stroke-width="5"/>
  <text x="118" y="138" font-family="Anton,'Arial Black',Impact,sans-serif" font-weight="900" font-size="64" fill="#ffffff">AdBlue<tspan font-size="28" dy="-28">®</tspan></text>
</svg>
